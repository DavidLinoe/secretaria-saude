<router-outlet></router-outlet>
<app-feedback></app-feedback>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex items-stretch z-50">
  @for (item of navItems; track item.route) {
    <a
      [routerLink]="item.route"
      routerLinkActive="text-slate-900 font-semibold border-t-2 border-slate-900 -mt-px"
      class="flex-1 flex flex-col items-center justify-center gap-1 py-2.5 text-slate-400 text-[11px]"
    >
      <i class="pi {{ item.icon }} text-base"></i>
      {{ item.label }}
    </a>
  }
</nav>
